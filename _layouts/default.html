  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.8;font-size:15.5px}
  .wrap{max-width:760px;margin:0 auto;padding:14px 16px 56px}
  .topnav{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .topnav a{flex:0 0 auto;font-size:13.5px;padding:6px 13px;border-radius:18px;background:#eef1f4;color:var(--text);text-decoration:none;white-space:nowrap}
  .topnav a.home{background:var(--accent);color:#fff;font-weight:600}
  h1{font-size:22px;line-height:1.4;margin:20px 0 10px}
  h2{font-size:18.5px;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
  h3{font-size:16.5px;margin:20px 0 8px}
  p{margin:10px 0}
  table{border-collapse:collapse;width:100%;font-size:13.5px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:normal}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
  th{background:#eef1f4;font-weight:600}
  blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0;color:#333}
  blockquote p{margin:6px 0}
  code{font-size:13px;background:#eef1f4;padding:1px 5px;border-radius:4px}
  pre{font-size:12.5px;background:#0d1117;color:#e6edf3;padding:12px;border-radius:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;line-height:1.5}
  pre code{background:none;color:inherit;padding:0}
  ul,ol{padding-left:22px}
  li{margin:5px 0}
  hr{border:none;border-top:1px solid var(--line);margin:26px 0}
  a{color:var(--accent)}
  .foot{margin-top:40px;text-align:center;color:var(--muted);font-size:12.5px}
</style>
